{% extends 'base.html' %}
{% block title %}Sign in | competitions.c1562{% endblock %}
{% block content %}
<section class="auth">
  <div class="auth-card">
    <h1 data-i18n="login.title">Sign in</h1>
    <form class="form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email" data-i18n="f.email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required value="{{ email }}">
      </div>
      <div class="field">
        <label for="password" data-i18n="f.password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-main" type="submit" data-i18n="login.submit">Sign in</button>
    </form>
    <p class="auth-alt"><span data-i18n="login.new">New here?</span> <a href="{{ url_for('auth.register', next=request.args.get('next')) }}" data-i18n="login.create">Create an account</a></p>
  </div>
</section>
{% endblock %}
